name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check coordinator and providers without live model calls
        run: python -m unittest discover -s tests -v
      - name: Check physics
        run: node -e "const p=require('./web/physics.js'); const c=['light-bending','gravity-clocks','spacetime','interference','two-slit-particles','standing-waves','tunneling','wave-packet','quantum-well','falling-time','diffraction','twin-trip'].flatMap(k=>p.checksFor(k)); if(c.some(x=>!x.pass))process.exit(1)"
      - name: Stage public demo only
        run: |
          mkdir _site
          cp web/index.html web/style.css web/app.js web/scene.js web/physics.js web/example.json web/curriculum.json _site/
          cp -R web/example-frames _site/
          if [ -f web/dashboard.json ]; then cp web/dashboard.json _site/; fi
          if [ -f web/proposals.json ]; then cp web/proposals.json _site/; fi
          if [ -d web/published ]; then cp -R web/published _site/; fi
          # Version asset links per commit so browsers never mix cached files from different deploys.
          sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
